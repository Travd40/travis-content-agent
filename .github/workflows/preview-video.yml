name: Preview video (posts nothing)

# Makes today's video the same way the daily post does, but posts nothing and
# leaves the post log alone. Download the MP4 from the run's artifacts to watch
# it. Runs on its own for pull requests that change how the video is made.
on:
  pull_request:
    paths:
      - agent.py
      - tools/scene_voice.py
      - tools/generate_content.py
      - tools/spoken_cta.py
      - tools/render_video.py
      - tools/chatterbox_tts.py
      - remotion/**
      - requirements-scene.txt
      - .github/workflows/preview-video.yml
  workflow_dispatch:
    inputs:
      topic:
        description: Topic for the preview (blank = the bot picks)
        required: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      # Travis's cloned voice (tools/chatterbox_tts.py). CPU-only torch first so
      # pip doesn't download the multi-GB CUDA build. If this fails the agent
      # falls back to ElevenLabs, so it must not fail the run.
      - name: Install voice cloning (Chatterbox)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-voice.txt

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-${{ hashFiles('requirements-voice.txt') }}

      # Logic and Harmony's voices (tools/scene_voice.py). Kokoro needs numpy 2
      # and Chatterbox needs numpy 1, so Kokoro gets its own virtual environment.
      # If this fails the video is simply made without the couple's scene.
      - name: Install the couple's voices (Kokoro)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python -m venv "$RUNNER_TEMP/kokoro-venv"
          "$RUNNER_TEMP/kokoro-venv/bin/pip" install -r requirements-scene.txt
          echo "KOKORO_PYTHON=$RUNNER_TEMP/kokoro-venv/bin/python" >> "$GITHUB_ENV"

      - name: Cache the couple's voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0-int8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion deps
        working-directory: remotion
        run: npm ci

      # A slow Ubuntu package mirror once stalled this step past the job
      # timeout, so no video posted that day. Pull a prebuilt ffmpeg from
      # GitHub releases first (fast), and only fall back to apt if that fails.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg already on the runner"; exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          if curl -fsSL --retry 3 --max-time 180 \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
             | tar -xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1; then
            echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ffmpeg/bin/ffprobe" -version | head -1
          else
            echo "Prebuilt download failed, falling back to apt"
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg
          fi

      - name: Make the preview video
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COACHING_WEBSITE:  travisdixoncoaching.com
          COACHING_NAME:     ${{ secrets.COACHING_NAME }}
          BOOK_LINK:         ${{ secrets.BOOK_LINK }}
          CALENDLY_LINK:     ${{ secrets.CALENDLY_LINK }}
          VOICE_ENGINE:      chatterbox
          PREVIEW_TOPIC:     ${{ github.event.inputs.topic || 'She says she is done with the relationship and he asks why. What a trained partner does in that moment.' }}
        run: python agent.py --preview

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-video
          path: |
            output/*.mp4
            output/*_caption.txt
          if-no-files-found: warn
          retention-days: 14
